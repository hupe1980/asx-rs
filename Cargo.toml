[package]
name = "asx-rs"
version = "0.14.0"
edition = "2024"
authors = ["hupe1980"]
description = "AS2 and AS4 B2B messaging library for Rust — signing, encryption, MDN, and ebMS3/AS4 profile support"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hupe1980/asx-rs"
readme = "README.md"
# Edition 2024 needs 1.85; the `dns` feature's DNS client needs 1.88, and a
# split MSRV per feature is a worse promise than one honest number. Raise
# deliberately: a bump is a breaking change for embedders pinned to an older
# toolchain, and CI builds this exact version.
rust-version = "1.88"
keywords = ["as2", "as4", "ebms3", "edi", "peppol"]
categories = ["network-programming", "cryptography", "encoding"]
# Not part of the published crate: internal review notes, the documentation
# website, CI scaffolding, benchmark data, and the gitignored working folders.
exclude = [
    "FINDINGS.md",
    "REVIEW.md",
    "artifacts/",
    "scripts/",
    "benches/",
    "site/",
    "concepts/",
    "specs/",
]

# `as2` and `as4` are not default features, so a docs.rs build with default
# features would publish an almost empty crate. Build everything.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[workspace]
members = ["xtask"]
default-members = ["."]

[features]
default = ["interop-strict", "async-ocsp", "compression", "trace"]
## Shared OpenSSL crypto gate. Pulled in by `as2`, `as4`, and `async-ocsp`.
## Enables RSA/ECDSA signing, X.509 parsing, CMS/PKCS#7, and OCSP support.
crypto = ["dep:openssl"]
as2 = ["crypto"]
as4 = ["crypto", "dep:quick-xml", "dep:roxmltree", "dep:aes-gcm"]
client = ["dep:reqwest"]
server = ["dep:axum"]
interop-strict = []
interop-relaxed = []
compression = ["dep:flate2"]
trace = []
prometheus = []
opentelemetry = ["dep:opentelemetry-api"]
async-ocsp = ["dep:reqwest", "crypto"]
dns = ["dep:hickory-resolver"]
testing = []

[lints.rust]
# `unsafe_code` is forbidden on the library itself via `#![forbid(unsafe_code)]`
# in `src/lib.rs`, not here: a workspace lint would also cover test targets, and
# `tests/xmlenc_streaming_metrics.rs` installs a counting `GlobalAlloc` to prove
# the streaming decrypt path does not buffer the whole payload.
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# NOT enabled: `indexing_slicing`, `unwrap_used`, `expect_used`. They fire on
# ~200 sites that are provably in range or assert an invariant established on
# the line above (`HEX[(b >> 4) as usize]` over a 16-byte table, `digest[..16]`
# over a SHA-256 output). Silencing each with an `#[allow]` would add no safety
# and would hide the next real one. Panic-freedom on untrusted input is enforced
# where it can actually be observed instead: `just fuzz-gate` fails on any panic
# across the profile loader, the policy resolver and wire parsing.

[dependencies]
tracing = "0.1"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "time", "io-util"] }
tokio-stream = "0.1"
sha2 = { version = "0.11", features = ["oid"] }
hmac = "0.13"
base64 = "0.22"
mailparse = "0.16"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
x509-parser = "0.18"
openssl = { version = "0.10", optional = true }
aes-gcm = { version = "0.11", optional = true }
flate2 = { version = "1", optional = true }
# `rustls` already enables platform certificate verification (rustls-platform-verifier),
# i.e. the OS/native trust store — reqwest 0.13 has no separate `rustls-native-certs`
# feature (that was never a valid reqwest feature name), so listing it broke resolution
# whenever reqwest re-resolved within the `>=0.13,<0.14` range.
reqwest = { version = ">=0.13, <0.14", default-features = false, features = ["json", "rustls", "http2"], optional = true }
axum = { version = ">=0.8, <0.9", optional = true }
uuid = { version = "1", features = ["v4", "serde"] }
dashmap = "6"
parking_lot = "0.12"
lru = "0.18"
memchr = "2"
libc = "0.2"
getrandom = "0.3"
zeroize = "1"
subtle = "2"
bytes = "1"
quick-xml = { version = "0.41", optional = true }
roxmltree = { version = "0.21", optional = true }
opentelemetry-api = { package = "opentelemetry", version = "0.32", default-features = false, features = ["metrics"], optional = true }
smallvec = "1"
rustix = { version = "1", features = ["fs"] }
hickory-resolver = { version = "0.26", default-features = false, features = ["system-config", "tokio"], optional = true }

[dev-dependencies]
proptest = "1"
tower = { version = "0.5", features = ["util"] }
criterion = { version = "0.5", features = ["html_reports"] }
opentelemetry-sdk = { package = "opentelemetry_sdk", version = "0.32", default-features = false, features = ["metrics"] }
# Docker-backed interop oracle (`tests/interop_xmlsec_oracle.rs`). Those tests
# are `#[ignore]`d, so a normal `cargo test` never starts a container.
testcontainers = { version = "0.27", features = ["blocking"] }

[[bench]]
name = "as4_streaming_vs_buffer"
harness = false
required-features = ["as4"]

[[bench]]
name = "event_bus_emission_modes"
harness = false

[[bench]]
name = "spool_headroom_hygiene"
harness = false
required-features = ["as4"]

