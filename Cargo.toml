[package]
name = "asx-rs"
version = "0.16.0"
edition = "2024"
authors = ["hupe1980"]
description = "AS2 and AS4 (ebMS3) B2B messaging: BDEW, Peppol, eDelivery and ENTSOG profiles, signed receipts and MDNs, one tower Service to receive"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hupe1980/asx-rs"
readme = "README.md"
homepage = "https://hupe1980.github.io/asx-rs/"
documentation = "https://docs.rs/asx-rs"
# The `peppol` feature's DNS client needs 1.88. A bump is a breaking change.
rust-version = "1.88"
keywords = ["as2", "as4", "ebms3", "edi", "peppol"]
categories = ["network-programming", "cryptography", "encoding"]
# Not published: the website, scripts, benches, the testkit, local notes.
exclude = [
    "*_FEEDBACK.md",
    "artifacts/",
    "scripts/",
    "benches/",
    "site/",
    "concepts/",
    "testkit/",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "asx"

[workspace]
members = ["xtask", "testkit"]
default-members = ["."]

[features]
default = ["as2", "as4", "http-client"]
## AS2 (RFC 4130): `asx::as2`.
as2 = ["dep:openssl", "dep:cms", "dep:der", "dep:flate2"]
## AS4 (ebMS3 / eDelivery): `asx::as4`.
as4 = ["dep:openssl", "dep:roxmltree", "dep:aes-gcm", "dep:aes-kw", "dep:flate2"]
## The built-in HTTPS client (reqwest).
http-client = ["dep:reqwest"]
## Peppol: SMP lookup through BDXL with the bundled resolver; implies `as4`.
peppol = ["as4", "dep:hickory-resolver"]
## Counters and histograms through the `metrics` facade.
metrics = ["dep:metrics"]

[lints.rust]
# `unsafe_code` is forbidden in `src/lib.rs`, not here: a test target
# (`tests/xmlenc_streaming_metrics.rs`) installs a counting `GlobalAlloc`.
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# Not enabled: `indexing_slicing`, `unwrap_used`, `expect_used` (they fire on
# provably in-range sites); panic-freedom on untrusted input is tested by the
# fuzz and property suites instead.

[dependencies]
tracing = "0.1"
# No `rt-multi-thread`: the library runs on a current-thread runtime too.
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time"] }
sha2 = { version = "0.11", features = ["oid"] }
base64 = "0.22"
mailparse = "0.16"
serde = { version = "1", features = ["derive", "rc"] }
x509-parser = "0.18"
openssl = { version = "0.10", optional = true }
aes-gcm = { version = "0.11", optional = true }
# RFC 3394 AES Key Wrap (XML Encryption kw-aes*).
aes-kw = { version = "0.3", optional = true, default-features = false, features = ["zeroize"] }
flate2 = { version = "1", optional = true }
# `rustls` verifies against the platform trust store (rustls-platform-verifier).
reqwest = { version = ">=0.13, <0.14", default-features = false, features = ["json", "rustls", "http2"], optional = true }
lru = "0.18"
memchr = "2"
getrandom = "0.3"
zeroize = "1"
subtle = "2"
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
tower-service = "0.3"
cms = { version = "0.2", optional = true }
der = { version = "0.7", optional = true }
roxmltree = { version = "0.21", optional = true }
hickory-resolver = { version = "0.26", default-features = false, features = ["system-config", "tokio"], optional = true }
metrics = { version = "0.24", optional = true }

[dev-dependencies]
# Doc examples only (`as4/signals.rs`, `as4/types.rs`).
uuid = { version = "1", features = ["v4"] }
# Path only: `cargo publish` strips it (test PKI, loopback partner, suites).
asx-rs-testkit = { path = "testkit" }
proptest = "1"
tower = { version = "0.5", features = ["util"] }
# Paused-time lease tests (`MemoryDedup`, the dedup conformance suite).
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread"] }
criterion = { version = "0.5", features = ["html_reports"] }
# Docker-backed oracles (`tests/interop_*`, `#[ignore]`d; `just interop`).
testcontainers = { version = "0.27", features = ["blocking"] }
redis = { version = "1.7", features = ["tokio-comp"] }
# Telemetry contract tests: span capture and a debugging recorder.
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
metrics-util = { version = "0.20", default-features = false, features = ["debugging"] }
metrics = "0.24"
serde_json = "1"
# The receive golden path (examples/as4_receive_axum.rs).
axum = ">=0.8, <0.9"
tower-http = { version = "0.6", features = ["timeout"] }

[[example]]
name = "as4_send"
required-features = ["as4", "http-client"]

[[example]]
name = "as4_receive_axum"
required-features = ["as4", "http-client"]

[[example]]
name = "as2_send_mdn"
required-features = ["as2", "http-client"]

[[bench]]
name = "as4_streaming_vs_buffer"
harness = false
required-features = ["as4"]


