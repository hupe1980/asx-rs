# phase4 configuration of the asx-phase4-peer (read from the class path).
global.debug=false
global.production=true
global.nostartupinfo=true
global.datapath=/data/phase4
phase4.manager.inmemory=true
# Stronger witness: every reference must be covered.
phase4.incoming.signature.requirefullcoverage=true
phase4.compatibility.domibus=false
phase4.dump.path=/data/dumps
