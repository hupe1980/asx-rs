[package]
name = "asx-rs-testkit"
# Always equal to the root package version; bumped together at release.
version = "0.16.0"
edition = "2024"
rust-version = "1.88"
authors = ["hupe1980"]
description = "Test support for asx-rs: test PKI, an in-process loopback partner, conformance suites. Dev-dependency only."
license = "MIT OR Apache-2.0"
repository = "https://github.com/hupe1980/asx-rs"
readme = "README.md"

[lib]
name = "asx_testkit"

[dependencies]
asx-rs = { path = "..", version = "=0.16.0", features = ["as2", "as4"] }
openssl = "0.10"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
serde_json = "1"
sha2 = "0.11"
base64 = "0.22"
http = "1"
http-body-util = "0.1"
bytes = "1"
tower-service = "0.3"
zeroize = "1"

[package.metadata.cargo-machete]
# The package is `asx-rs`; its library is imported as `asx`.
ignored = ["asx-rs"]
