base_url = "https://hupe1980.github.io/asx-rs"
title = "asx-rs"
description = "AS2 and AS4 (ebMS3) B2B messaging for Rust: network profiles for BDEW, Peppol, eDelivery and ENTSOG, verified receipts and MDNs, strict by default."
default_language = "en"
compile_sass = true
minify_html = true
generate_sitemap = true
generate_robots_txt = true
build_search_index = true

taxonomies = []

[markdown]
smart_punctuation = false
render_emoji = false
insert_anchor_links = "heading"

[search]
index_format = "elasticlunr_json"
# Full page bodies are indexed, deliberately. Truncating shrinks the file a lot
# but turns full-text search into title search — a reader looking for "digest"
# or "replay window" gets nothing, which is worse than a larger file.
#
# The size does not reach the critical path: `search.js` fetches the index only
# on the first search interaction, so it never affects page load or Core Web
# Vitals, and GitHub Pages serves it compressed.

[extra]
repo = "https://github.com/hupe1980/asx-rs"
crate = "https://crates.io/crates/asx-rs"
api_docs = "https://docs.rs/asx-rs"
# Shown in the page footer and the JSON-LD `softwareVersion`.
version = "0.16.1"
# Fallback social-card text when a page sets no description.
default_description = "Async-native AS2 and AS4 (ebMS3) B2B messaging for Rust."

# Ordered navigation for the documentation sidebar. Zola cannot infer a
# teaching order from the filesystem, so it is declared once here rather than
# scattered across per-page weights.
[[extra.nav]]
title = "Start here"
